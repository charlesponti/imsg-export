[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imsg-export"
description = "Export the full contents of macOS Messages.app - iMessage, SMS and RCS - to JSONL, CSV and readable transcripts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Charles Ponti", email = "cj@ponti.io" }]
requires-python = ">=3.11"
keywords = ["imessage", "sms", "macos", "messages", "export", "chat-db", "backup"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/charlesponti/imsg-export"
Repository = "https://github.com/charlesponti/imsg-export"
Issues = "https://github.com/charlesponti/imsg-export/issues"
Changelog = "https://github.com/charlesponti/imsg-export/blob/main/CHANGELOG.md"

[project.scripts]
imsg-export = "imsg_export.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.15",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "imsg_export.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "__pycache__", "docs/legacy", ".pytest_cache", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]

[tool.ruff.lint.isort]
known-first-party = ["imsg_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["imsg_export"]
